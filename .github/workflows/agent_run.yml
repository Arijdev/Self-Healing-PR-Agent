name: Autonomous Agent Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_files:
        description: 'Comma separated list of target files'
        required: true
        default: 'app.py, main.py, agent.py, tools.py'
      task_description:
        description: 'Task description for the agent'
        required: true
        default: 'Review the code for potential bugs.'

jobs:
  agent-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Need full history for git operations
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Agent Workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PATH: .
        run: |
          # Use workflow_dispatch inputs or fallback defaults for push events
          FILES="${{ github.event.inputs.target_files || 'app.py, main.py, agent.py, tools.py' }}"
          TASK="${{ github.event.inputs.task_description || 'Review the code for potential bugs and fix them.' }}"
          
          # Run the agent with auto-approve
          python main.py --files "$FILES" --task "$TASK" --auto-approve
